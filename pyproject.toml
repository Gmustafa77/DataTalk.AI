[project]
name = "datatalk-ai"
version = "3.0.0"
description = "DataTalk.AI - conversational analytics for a healthcare Appeals & Grievances portfolio (Streamlit POC)."
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "streamlit>=1.66",
    "pandas>=2.3",
    "numpy>=2.3",
    "plotly>=6.3",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "groq>=0.37",
    "databricks-sql-connector>=4.1",
    "sqlglot>=27",
    "streamlit-mic-recorder>=0.0.8",
    "filelock>=4.2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.13",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM108"]
