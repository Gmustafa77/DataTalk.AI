<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">DataTalk.AI — How a question becomes a verified answer</title>
<desc id="d">Six-stage AI flow: ask, understand, query, analyze, verify, answer; with a deterministic quick-action path and built-in trust controls.</desc>
<defs><marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/></marker><marker id="arg" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity=".10"/></filter></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<text x="60" y="70" font-size="34" font-weight="800" fill="#0f172a">DataTalk.AI · From Question to Verified Answer</text>
<text x="60" y="106" font-size="18" fill="#64748b">AI understands the question and drafts the query — every number shown is computed and checked by the system, never invented.</text>
<g filter="url(#sh)"><rect x="60" y="160" width="218" height="330" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/></g>
