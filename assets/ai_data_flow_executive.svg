<text x="84" y="288" font-size="26" font-weight="800" fill="#0f172a">Ask</text>
<text x="84" y="328" font-size="15" fill="#475569">Plain-English question</text>
<text x="84" y="354" font-size="15" fill="#475569">typed or spoken</text>
<text x="84" y="460" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="1.5">INPUT</text>
<path d="M281,325.0 L309,325.0" stroke="#94a3b8" stroke-width="3" marker-end="url(#ar)"/>
<g filter="url(#sh)"><rect x="312" y="160" width="218" height="330" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/></g>
<rect x="312" y="160" width="218" height="8" rx="4" fill="#7c3aed"/>
<circle cx="356" cy="222" r="26" fill="#7c3aed" fill-opacity=".12"/>
<text x="356" y="230" font-size="20" font-weight="800" fill="#7c3aed" text-anchor="middle">02</text>
<text x="336" y="288" font-size="26" font-weight="800" fill="#0f172a">Understand</text>
<text x="336" y="328" font-size="15" fill="#475569">Supervisor routes it</text>
<text x="336" y="354" font-size="15" fill="#475569">Planner splits it into</text>
<text x="336" y="380" font-size="15" fill="#475569">up to 5 sub-questions</text>
<rect x="336" y="440" width="131.2" height="30" rx="15" fill="#7c3aed" fill-opacity=".12" stroke="#7c3aed" stroke-width="1.2"/>
<text x="401.6" y="460" font-size="14" font-weight="700" fill="#7c3aed" text-anchor="middle">AI · Planner</text>
<path d="M533,325.0 L561,325.0" stroke="#94a3b8" stroke-width="3" marker-end="url(#ar)"/>
<g filter="url(#sh)"><rect x="564" y="160" width="218" height="330" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/></g>
<rect x="564" y="160" width="218" height="8" rx="4" fill="#2563eb"/>
<circle cx="608" cy="222" r="26" fill="#2563eb" fill-opacity=".12"/>
<text x="608" y="230" font-size="20" font-weight="800" fill="#2563eb" text-anchor="middle">03</text>
<text x="588" y="288" font-size="26" font-weight="800" fill="#0f172a">Query</text>
<text x="588" y="328" font-size="15" fill="#475569">SQL agent writes query</text>
<text x="588" y="354" font-size="15" fill="#475569">Guardrail: read-only,</text>
<text x="588" y="380" font-size="15" fill="#475569">approved data only</text>
<text x="588" y="406" font-size="15" fill="#475569">Runs on Databricks</text>
<rect x="588" y="440" width="148.39999999999998" height="30" rx="15" fill="#2563eb" fill-opacity=".12" stroke="#2563eb" stroke-width="1.2"/>
<text x="662.2" y="460" font-size="14" font-weight="700" fill="#2563eb" text-anchor="middle">AI · SQL agent</text>
<path d="M785,325.0 L813,325.0" stroke="#94a3b8" stroke-width="3" marker-end="url(#ar)"/>
<g filter="url(#sh)"><rect x="816" y="160" width="218" height="330" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/></g>
<rect x="816" y="160" width="218" height="8" rx="4" fill="#0891b2"/>
<circle cx="860" cy="222" r="26" fill="#0891b2" fill-opacity=".12"/>
<text x="860" y="230" font-size="20" font-weight="800" fill="#0891b2" text-anchor="middle">04</text>
<text x="840" y="288" font-size="26" font-weight="800" fill="#0f172a">Analyze</text>
<text x="840" y="328" font-size="15" fill="#475569">Charts built from results</text>
<text x="840" y="354" font-size="15" fill="#475569">Evidence facts computed</text>
<text x="840" y="380" font-size="15" fill="#475569">AI writes the narrative</text>
<rect x="840" y="440" width="191.4" height="30" rx="15" fill="#0891b2" fill-opacity=".12" stroke="#0891b2" stroke-width="1.2"/>
<text x="935.7" y="460" font-size="14" font-weight="700" fill="#0891b2" text-anchor="middle">AI · Insight writer</text>
<path d="M1037,325.0 L1065,325.0" stroke="#94a3b8" stroke-width="3" marker-end="url(#ar)"/>
<g filter="url(#sh)"><rect x="1068" y="160" width="218" height="330" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/></g>
<rect x="1068" y="160" width="218" height="8" rx="4" fill="#059669"/>
<circle cx="1112" cy="222" r="26" fill="#059669" fill-opacity=".12"/>
<text x="1112" y="230" font-size="20" font-weight="800" fill="#059669" text-anchor="middle">05</text>
<text x="1092" y="288" font-size="26" font-weight="800" fill="#0f172a">Verify</text>
<text x="1092" y="328" font-size="15" fill="#475569">Every number matched</text>
<text x="1092" y="354" font-size="15" fill="#475569">to evidence</text>
<text x="1092" y="380" font-size="15" fill="#475569">Structured output checks</text>
<text x="1092" y="406" font-size="15" fill="#475569">Multi-part answers QA’d</text>
<rect x="1092" y="440" width="139.8" height="30" rx="15" fill="#059669" fill-opacity=".12" stroke="#059669" stroke-width="1.2"/>
<text x="1161.9" y="460" font-size="14" font-weight="700" fill="#059669" text-anchor="middle">AI · Reviewer</text>
<path d="M1289,325.0 L1317,325.0" stroke="#94a3b8" stroke-width="3" marker-end="url(#ar)"/>
<g filter="url(#sh)"><rect x="1320" y="160" width="218" height="330" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/></g>
<rect x="1320" y="160" width="218" height="8" rx="4" fill="#ea580c"/>
<circle cx="1364" cy="222" r="26" fill="#ea580c" fill-opacity=".12"/>
<text x="1364" y="230" font-size="20" font-weight="800" fill="#ea580c" text-anchor="middle">06</text>
<text x="1344" y="288" font-size="26" font-weight="800" fill="#0f172a">Answer</text>
<text x="1344" y="328" font-size="15" fill="#475569">Key finding + charts</text>
<text x="1344" y="354" font-size="15" fill="#475569">Evidence &amp; reasoning</text>
<text x="1344" y="380" font-size="15" fill="#475569">Recommended actions</text>
<text x="1344" y="406" font-size="15" fill="#475569">Exact SQL for audit</text>
<text x="1344" y="460" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="1.5">OUTPUT</text>
<path d="M421.0,490 L421.0,542 L1429.0,542 L1429.0,494" stroke="#64748b" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#arg)"/>
<rect x="595.0" y="522" width="660" height="40" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="925.0" y="548" font-size="16" fill="#334155" text-anchor="middle">Quick actions — forecast, anomalies, overdue, comparisons · no AI needed</text>
<text x="60" y="650" font-size="15" font-weight="800" fill="#64748b" letter-spacing="2">TRUST BUILT IN</text>
<rect x="60.0" y="668" width="352.0" height="112" rx="14" fill="#2563eb" fill-opacity=".06" stroke="#2563eb" stroke-opacity=".35"/>
<rect x="60.0" y="668" width="6" height="112" rx="3" fill="#2563eb"/>
<text x="86.0" y="706" font-size="19" font-weight="800" fill="#0f172a">Read-only by design</text>
<text x="86.0" y="736" font-size="15" fill="#475569">Only approved table and columns;</text>
<text x="86.0" y="758" font-size="15" fill="#475569">no data can be changed</text>
<rect x="436.0" y="668" width="352.0" height="112" rx="14" fill="#059669" fill-opacity=".06" stroke="#059669" stroke-opacity=".35"/>
<rect x="436.0" y="668" width="6" height="112" rx="3" fill="#059669"/>
<text x="462.0" y="706" font-size="19" font-weight="800" fill="#0f172a">No invented numbers</text>
<text x="462.0" y="736" font-size="15" fill="#475569">AI sentences with unverified figures</text>
<text x="462.0" y="758" font-size="15" fill="#475569">are removed automatically</text>
<rect x="812.0" y="668" width="352.0" height="112" rx="14" fill="#7c3aed" fill-opacity=".06" stroke="#7c3aed" stroke-opacity=".35"/>
<rect x="812.0" y="668" width="6" height="112" rx="3" fill="#7c3aed"/>
<text x="838.0" y="706" font-size="19" font-weight="800" fill="#0f172a">Consistent, structured AI</text>
<text x="838.0" y="736" font-size="15" fill="#475569">Temperature 0, fixed seed, validated</text>
<text x="838.0" y="758" font-size="15" fill="#475569">responses (Pydantic schemas)</text>
<rect x="1188.0" y="668" width="352.0" height="112" rx="14" fill="#ea580c" fill-opacity=".06" stroke="#ea580c" stroke-opacity=".35"/>
<rect x="1188.0" y="668" width="6" height="112" rx="3" fill="#ea580c"/>
<text x="1214.0" y="706" font-size="19" font-weight="800" fill="#0f172a">Resilient by default</text>
<text x="1214.0" y="736" font-size="15" fill="#475569">Bounded retries and rule-based</text>
<text x="1214.0" y="758" font-size="15" fill="#475569">fallbacks keep answers flowing</text>
<line x1="60" y1="800" x2="1540" y2="800" stroke="#e2e8f0"/>
<text x="60.0" y="842" font-size="30" font-weight="800" fill="#1d4ed8">2–4</text>
<text x="60.0" y="868" font-size="14" fill="#475569">AI calls per typical question</text>
<text x="430.0" y="842" font-size="30" font-weight="800" fill="#1d4ed8">≤ 17</text>
<text x="430.0" y="868" font-size="14" fill="#475569">AI calls worst case</text>
<text x="800.0" y="842" font-size="30" font-weight="800" fill="#1d4ed8">0</text>
<text x="800.0" y="868" font-size="14" fill="#475569">AI calls for quick actions</text>
<text x="1170.0" y="842" font-size="30" font-weight="800" fill="#1d4ed8">5</text>
<text x="1170.0" y="868" font-size="14" fill="#475569">sub-questions per message, max</text>
<text x="1540" y="886" font-size="12" fill="#94a3b8" text-anchor="end">Made and Designed by EXL India | 2026</text>
